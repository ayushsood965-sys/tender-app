<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Shield Base Background -->
  <path d="M32 3 L54 11 C54 28 46 47 32 59 C18 47 10 28 10 11 Z" fill="url(#shieldGrad)" filter="url(#shadow)" stroke="#818cf8" stroke-width="1.5"/>

  <!-- Inner Golden Crest Ring / Pillar Frame -->
  <path d="M32 8 L49 14.5 C49 28 42.5 43.5 32 53.5 C21.5 43.5 15 28 15 14.5 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.65" stroke-dasharray="2 1.5"/>

  <!-- University Dome & Pillars -->
  <!-- Triangular Roof / Pediment -->
  <path d="M32 15 L43 21 L21 21 Z" fill="url(#goldGrad)"/>
  
  <!-- Architrave Beam -->
  <rect x="22" y="22" width="20" height="2" rx="0.8" fill="#ffffff"/>
  
  <!-- 3 Classical Pillars -->
  <rect x="24" y="25" width="2.5" height="11" rx="0.5" fill="#ffffff" opacity="0.95"/>
  <rect x="30.75" y="25" width="2.5" height="11" rx="0.5" fill="#ffffff" opacity="0.95"/>
  <rect x="37.5" y="25" width="2.5" height="11" rx="0.5" fill="#ffffff" opacity="0.95"/>
  
  <!-- Pillar Base Beam -->
  <rect x="21" y="37" width="22" height="2" rx="0.8" fill="#ffffff"/>

  <!-- Document Quill & Seal Motif -->
  <g transform="translate(24, 39) scale(0.65)">
    <!-- Document Card -->
    <rect x="2" y="3" width="18" height="22" rx="2.5" fill="#ffffff" stroke="#e0e7ff" stroke-width="1"/>
    <!-- Document Text Lines -->
    <line x1="6" y1="8" x2="16" y2="8" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="12" x2="16" y2="12" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="16" x2="12" y2="16" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Official Golden Seal / Star -->
    <circle cx="16" cy="18" r="4" fill="url(#goldGrad)"/>
    <path d="M14.5 18 L15.5 19 L17.5 17" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stars at top representing NAAC 'A' grade excellence -->
  <circle cx="32" cy="10.5" r="1.2" fill="#fbbf24"/>
  <circle cx="27" cy="11.5" r="0.9" fill="#fbbf24"/>
  <circle cx="37" cy="11.5" r="0.9" fill="#fbbf24"/>
</svg>
