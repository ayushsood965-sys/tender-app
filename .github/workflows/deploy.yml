name: Build & Deploy to Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build and Push Backend
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      # 2. Build and Push Frontend
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          build-args: |
            VITE_API_URL=https://tdmserver.scholarhubhpu.in/api
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

      # 3. Trigger Coolify Deployments
      - name: Trigger Coolify Deployment
        run: |
          echo "Triggering Backend deployment on Coolify..."
          curl -s -X POST "http://169.58.12.127:8000/api/v1/deploy?uuid=f2gah2hfo4dokfzazygldvqu" \
            -H "Authorization: Bearer 10|NFtP1Hcm6ltyrzQOvEfWZzcZFVDmRUKpKI7yQlUB" || true

          echo "Triggering Frontend deployment on Coolify..."
          curl -s -X POST "http://169.58.12.127:8000/api/v1/deploy?uuid=umblobeluske3y7ty8h22qlp" \
            -H "Authorization: Bearer 10|NFtP1Hcm6ltyrzQOvEfWZzcZFVDmRUKpKI7yQlUB" || true
